version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: plagiarism_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: plagiarism_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plagiarism_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plagiarism_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/plagiarism_db
      USE_IN_MEMORY_FALLBACK: "false"
      SERPAPI_API_KEY: "${SERPAPI_API_KEY:-}"
      BING_SEARCH_API_KEY: "${BING_SEARCH_API_KEY:-}"
      PORT: 8000
    volumes:
      - ./backend/app:/app/app

volumes:
  pgdata:
