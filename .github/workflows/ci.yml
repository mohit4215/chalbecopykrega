name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. FastAPI Backend CI: Linting & Pytest Suite
  # ============================================================================
  backend-ci:
    name: Backend CI (Python / FastAPI / Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System OCR & Text Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Flake8 Code Linter (errors only)
        run: |
          flake8 app tests --config=.flake8 --select=E9,F63,F7,F82,F821 --count --statistics

      - name: Run Flake8 Style Report (advisory)
        continue-on-error: true
        run: |
          flake8 app tests --config=.flake8 --count --statistics

      - name: Execute Pytest Suite (Unit, Auth, Ingestion & Mock APIs)
        run: |
          pytest tests -v --durations=10
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET_KEY: ci-test-jwt-secret-key-384bit
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          STRIPE_SECRET_KEY: sk_test_mock_stripe_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_stripe_webhook_secret

  # ============================================================================
  # 2. React Frontend CI: Linting, Jest Tests & Production Build
  # ============================================================================
  frontend-ci:
    name: Frontend CI (Node.js / React / Jest / ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Execute Jest & React Testing Library Suite
        run: npm test -- --ci --watchAll=false

      - name: Verify Production Vite Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
