name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. Build and Push Docker Images to Container Registry
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Secret values are mapped to env because `secrets` is not allowed in
      # step-level `if:` expressions (it makes the workflow invalid).
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional login to Docker Hub if credentials are provided in secrets
      - name: Log in to Docker Hub (Optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Extract metadata & tags for Backend
      - name: Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short,prefix=sha-

      # Build and Push Backend Docker Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata & tags for Frontend
      - name: Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short,prefix=sha-

      # Build and Push Frontend Docker Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Remote Production Deployment & Orchestration
  # ============================================================================
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      PROD_URL: ${{ secrets.PROD_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Deployment Path A: Trigger Cloud Webhook (Render / Cloud PaaS)
      - name: Trigger Cloud Webhook Deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering automated rolling deployment on cloud PaaS..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" || true
          echo "Deploy hook dispatched."

      # Deployment Path B: Remote SSH Execution to Production VPS
      - name: Execute Remote SSH Deployment on Server
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER || 'ubuntu' }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=================================================="
            echo "Starting Production Server Update..."
            echo "=================================================="
            
            APP_DIR="/opt/chalbecopykrega"
            if [ ! -d "$APP_DIR" ]; then
              sudo git clone "https://github.com/mohit4215/chalbecopykrega.git" "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            
            echo "[+] Authenticating container registry on production host..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            
            echo "[+] Pulling latest container images..."
            docker compose pull || true
            
            echo "[+] Restarting services with zero orphan drift..."
            docker compose up -d --build --remove-orphans
            
            echo "[+] Cleaning dangling images..."
            docker image prune -f || true
            
            echo "[✓] Deployment completed successfully!"

      # Post-deployment Health Check Verification
      - name: Verify Production Health Endpoint
        if: env.PROD_URL != ''
        run: |
          echo "Waiting 15 seconds for services to become healthy..."
          sleep 15
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused "$PROD_URL/api/health" || {
            echo "Production health check failed!";
            exit 1;
          }
          echo "Production deployment is live and healthy!"
