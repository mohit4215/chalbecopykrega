# ==============================================================================
# Nginx Reverse Proxy / API Gateway Configuration
# Serves React SPA on "/" and proxies API traffic to FastAPI on "/api/*"
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging formats
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression for fast React frontend delivery
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream backend cluster definition
    upstream backend_api {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Large file uploads (essential for multi-page PDF/DOCX scanned files)
        client_max_body_size 60M;
        client_body_timeout 120s;

        # ----------------------------------------------------------------------
        # FastAPI Backend Proxy Routing (/api/*)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Header forwarding for accurate client IP tracking and HTTPS awareness
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-running document OCR and vector embeddings
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Disable proxy buffering for streaming responses
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # Swagger Documentation Routing (/docs & /redoc)
        # ----------------------------------------------------------------------
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------------------------------------
        # React Frontend Single Page Application (SPA) Routing
        # ----------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets (JS, CSS, images) for 30 days
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # Custom error page
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
